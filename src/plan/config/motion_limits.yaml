# Single source for planner feasibility and PID/LQR execution limits.
# Load AFTER node/deployment YAML (ROS 2 Humble wildcard/CLI precedence).
# Do not duplicate these keys in deployment overrides.
/**:
  ros__parameters:
    v_nominal: 0.5  # comparison cruise speed; increase here for later speed experiments
    v_max: 0.6
    w_max: 0.60
    linear_acceleration: 0.15
    linear_deceleration: 0.15
    angular_acceleration: 2.5
    lateral_acceleration: 0.1
    feedforward_angular_fraction: 0.75
    angular_acceleration_fraction: 0.75
    min_turn_speed: 0.03  # candidate feasibility floor, never a forced minimum command
    # Shared algorithm policy; physical limits above stay unchanged.
    enable_dynamic_angular_budget: true
    speed_envelope_rounds: 20
    speed_search_iterations: 48
    speed_envelope_tolerance: 0.0001  # m/s
    dynamic_budget_utilization: 0.95  # nominal margin for measured speed lag; hard angular budget unchanged
