planner:
  ros__parameters:
    use_sim_time: true
    inflated_grid_topic: /plan/inflated_grid
    goal_topic: /goal_pose
    path_topic: /plan
    raw_path_topic: /plan/raw_path
    profile_topic: /plan/profile  # exact paired Path, analytic tangents/curvature and stop flags
    status_topic: /plan/status
    # Required: fill from the actual map frame; no map/localization is assumed.
    planning_frame: ""
    base_frame: base_footprint
    tf_timeout_sec: 0.2
    tf_max_age_sec: 0.5
    max_cells: 4000000
    post_processing:
      enable_shortcut: true
      resample_spacing: 0.1  # metres; bends/endpoints are additionally retained
      shortcut_max_lookahead: 200  # simplified vertices; bounds greedy shortcut work
      max_output_points: 100000
      enable_arc_smoothing: true
      arc_radius: 0.5  # preferred radius, metres; limited by neighbouring segment lengths
      arc_min_radius: 0.20  # do not shrink below this; retain the corner if no candidate is safe
      arc_radius_samples: 6  # bounded search, including both radius limits; range [2, 1000]
      arc_max_deviation: 0.001  # metres; also used for conservative continuous-arc checking
      arc_max_angle: 0.10  # radians between arc samples; keeps low-speed bends visibly smooth
      arc_radius_max: 0.70  # allow a larger radius when collision/available space permit
      arc_radius_weight: 1.0  # cost: weight * (radius - preferred_radius)^2
      arc_curvature_weight: 0.04  # cost: weight / radius; favours gentler bends
      recover_shortcut_corners: true  # compare pre-shortcut route when shortcut leaves stops
      retained_corner_cost: 2.0  # metres-equivalent cost per retained corner in that comparison
      enable_curvature_transition: true  # line -> clothoid -> arc -> clothoid -> line
      transition_length: 0.30  # preferred length of each entry/exit transition, metres
      transition_min_length: 0.04  # search shorter transitions when space is limited
      transition_samples: 4  # bounded length search, preferred to minimum
      max_curvature_rate: 30.0  # comfort reference in joint mode; hard rejection in legacy baseline
      enable_joint_optimization: true
      enable_local_relocation: true
      enable_arc_fallback: true
      max_length_ratio: 1.10  # relative to the same-goal legacy safe baseline
      local_shift_max: 0.20  # metres; separate from fallback_deviation
      local_window_length: 2.0  # metres on each side of an edited corner
      local_anchor_spacing: 0.25
      local_shift_samples: 4
      local_max_variants: 24
      local_beam_width: 4
      joint_max_candidates: 64
      joint_max_labels: 64
      joint_work_budget: 2000000
      fallback_deviation: 0.01  # metres, certified relative to nominal line/circle geometry
      fallback_blend_min: 0.01
      fallback_blend_max: 0.08
      fallback_blend_samples: 4
      curve_max_depth: 20
      clearance_target: 0.20  # distance from INFLATED blocked cells, not raw wall clearance
      clearance_weight: 0.5  # seconds, normalized penalty
      smoothness_weight: 0.2  # seconds, normalized penalty

      # Experimental: enable explicitly; all distances are metres, times seconds.
      enable_window_bezier: true
      enable_turn_speed_coordination: false
      window_geometry_policy: geometry_first  # legacy retains the previous optimizer for A/B
      window_detailed_diagnostics: false  # controls/failed leaves; compact candidate history always saved
      window_refine_min_events: 0  # require this many existing turn events; 0 disables filter
      window_refine_rate_weight: -1.0  # -1 inherits rate_weight; otherwise only refined windows
      window_refine_min_curvature: 0.0  # skip refinement on lower-curvature baseline windows
      window_refine_objective: true  # opt-in peak-aware objective and comparable selection metrics
      window_peak_weight: 1.0  # integral excess-curvature term when refine_objective is enabled
      window_max_curvature_weight: 0.0  # sampled window maximum; zero retains old objective
      window_coarse_budget_fraction: 0.7  # parent share for first coarse seed when prioritized
      window_prioritize_coarse_seed: true  # opt-in budget-neutral seed ordering
      window_local_refinement: true  # one warm local pass, only within unused parent budget
      window_feature_refinement: false  # experimental; promote only after fixed-input acceptance
      window_feature_enter_curvature: 0.15  # signed-turn hysteresis, 1/m
      window_feature_exit_curvature: 0.05
      window_feature_min_length: 0.12  # reject short sign flicker, m
      window_feature_knot_min_spacing: 0.15
      window_feature_bound_tolerance: 0.05  # relative interval-bound/sample gap
      window_feature_rate_weight: 4.0  # only for feature-eligible windows
      window_feature_min_curvature: 2.0  # preserve already gentle windows, 1/m
      window_feature_min_turns: 4  # dense multi-turn groups; simple S bends retain current strategy
      window_feature_max_passes: 3
      window_feature_sample_depth: 3
      window_include_coarse_seed: true  # scale nearest 1 also tries event-independent geometry
      window_seed_fit_tolerance: 0.005  # metres; adaptive initial fit, not a collision tolerance
      window_geometry_min_gain: 0.01  # same stop count requires at least 1% geometry improvement
      window_parent_budget_fraction: 0.5  # reserve the rest for eligible child windows
      window_split_max_depth: 2
      window_split_min_length: 1.0
      window_split_min_events: 2
      window_merge_gap: 1.0
      window_extension: 0.3
      window_knot_spacing: 0.5
      window_max_deviation: 0.2
      window_max_time_ratio: 1.1
      window_target_speed: 0.25
      window_target_radius: 0.7
      window_transition_scale: 0.25
      window_solver_seconds: 0.25
      window_total_seconds: 1.0
      window_iterations: 50
      window_objective_samples: 8
      window_max_knots: 64
      window_check_budget: 200000
      window_seed_scales: [0.75, 1.0, 1.25]
      window_curvature_weight: 1.0
      window_rate_weight: 1.0
      window_join_weight: 0.2
      window_deviation_weight: 0.25
      window_clearance_weight: 0.5
      window_speed_weight: 2.0
      window_constraint_fraction: 0.80  # optimizer seeks margin below hard bounds
      window_derivative_min_scale: 0.25
      window_derivative_max_scale: 2.0
      window_heading_max_change: 1.5707963267948966  # radians around seed heading
      window_min_tangent_ratio: 0.05  # regularity penalty relative to interval chord
      window_constraint_weight: 100.0  # sampled hard-bound penalty; independent certification still required
      coordination_min_gain: 0.005  # m/s; aligns with 0.02 m/s^2 for 0.20 s
      coordination_policy: legacy  # bounded remains opt-in until joint closed-loop acceptance
      coordination_max_time_loss: 0.02  # local groups and complete uncoordinated envelope
      coordination_group_max_gap: 1.0  # merge nearby curved portions; independent of search lookahead
      coordination_curvature_threshold: 0.10  # 1/m; rate-limited portions are also included
      coordination_max_candidates: 512
      coordination_trim_fractions: [0.05, 0.1, 0.15, 0.25, 0.4, 0.6, 0.8, 1.0]
      coordination_max_gap: 1.0
      coordination_max_rounds: 20
      coordination_enable_platforms: true  # only within eligible curved portions, never whole-route slowdown
      coordination_platform_min_speed: 0.20
      coordination_platform_min_length: 0.30
      coordination_acceleration_threshold: 0.02
      coordination_acceleration_filter_tau: 0.15  # match analysis acceleration filter
      coordination_min_duration: 0.2
