# Offline benchmark preparation. Run tools/run_bezier_benchmark.py from the workspace root.
benchmark:
  map_yaml: map/edited/edited.yaml
  grid_params_file: src/plan/config/planning_grid.yaml
  deployment_params_file: src/urdf/config/navigation_baseline.yaml
  planner_params_file: src/plan/config/astar.yaml
  motion_limits_file: src/plan/config/motion_limits.yaml
  output_root: log/bezier_window
  initial_yaw: 0.0
  p1:
    frozen_run: data/path_record/run_20261029_184651_724167
    variants: [baseline, legacy, geometry_first]
    front_region: [1.5, 3.0]
    bottleneck_region: [11.5, 13.5]
    diagnostic_window_seconds: 2.0
    diagnostic_path_seconds: 8.0
    required_curvature_reduction: 0.10
    required_rate_bound: 30.0
    start: [0.0, 0.0]
    goal: [-4.375, 7.645]
    max_invalid_retries: 1
  repeats_per_direction: 3
  gazebo:
    ros_domain_id: 132
    master_uri: http://127.0.0.1:11349
    startup_timeout: 90.0
    trial_timeout: 300.0
    stabilization_seconds: 2.0
    start_position_tolerance: 0.01
    snap_start_to_cell_center: true
    start_heading_tolerance: 0.08
    model: car
    model_z: 0.10
    # Confirmed sim spawn and AMCL initial pose; used only to reset experiments.
    world_reference_pose: [1.0, 1.0, 0.0]
    map_reference_pose: [0.0, 0.0, -1.948]
    initial_position_variance: 0.0001
    initial_heading_variance: 0.0001
  scenarios:
    - {name: outward, start: [0.0, 0.0], goal: [-0.875, 7.645]}
    - {name: inward, start: [-0.875, 7.645], goal: [0.0, 0.0]}
  synthetic:
    width: 160
    height: 160
    resolution: 0.05
    origin: [0.0, 0.0, 0.0]
    scenarios:
      - {name: straight, points: [[1.0, 1.0], [5.0, 1.0]]}
      - {name: right_angle, points: [[1.0, 1.0], [3.0, 1.0], [3.0, 4.0]]}
      - {name: same_turns, points: [[1.0, 1.0], [3.0, 1.0], [3.0, 2.0], [1.0, 2.0]]}
      - {name: s_turns, points: [[1.0, 1.0], [3.0, 1.0], [3.0, 2.0], [5.0, 2.0]]}
