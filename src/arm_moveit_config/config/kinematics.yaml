arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  # Five revolute joints cannot realize every six-dimensional pose.
  # Position-only targets leave orientation unconstrained; full pose constraints
  # still have to be satisfied by the planner when explicitly requested.
  position_only_ik: true
  kinematics_solver_search_resolution: 0.0050000000000000001
  kinematics_solver_timeout: 0.0050000000000000001
