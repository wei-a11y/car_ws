safety_gate:
  ros__parameters:
    use_sim_time: true
    enable: true  # false inhibits auto motion; it never bypasses scan checks
    raw_cmd_topic: /cmd_vel_raw
    cmd_vel_topic: /cmd_vel
    scan_topic: /scan
    status_topic: /controller/safety/status
    debug_topic: /controller/safety/min_range
    base_frame: base_footprint
    scan_frame: laser_link
    forward_sector_half_angle: 0.7853981633974483  # +/-45 deg in base_frame
    stop_distance: 0.50  # m from LiDAR origin along a ray, NOT bumper clearance
    release_distance: 0.65  # must exceed stop_distance
    max_beam_gap: 0.035  # rad; current scan has ~0.01556 rad ray spacing
    allow_positive_infinity: true  # Gazebo no-return convention; NaN/-Inf are invalid
    publish_period: 0.02
    raw_timeout_sec: 0.20
    scan_timeout_sec: 0.30  # current Gazebo LiDAR rate: 10 Hz
    clock_timeout_sec: 0.30  # steady-clock guard also handles paused /clock
    future_tolerance_sec: 0.02
    tf_timeout_sec: 0.0  # do not block the stop timer waiting for TF
    v_max: 0.20  # same low-speed bound as current LQR
    w_max: 0.60
