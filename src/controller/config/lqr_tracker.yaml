lqr_controller:
  # Physical motion limits are loaded from plan/config/motion_limits.yaml.
  ros__parameters:
    use_sim_time: true
    path_topic: /plan
    profile_topic: /plan/profile
    require_path_profile: true  # exact pairing; missing/mismatched metadata always stops
    raw_cmd_topic: /cmd_vel_raw
    status_topic: /controller/lqr/status
    debug_topic: /controller/lqr/debug
    tracking_topic: /controller/lqr/tracking  # synchronized pose/errors/progress/velocity for recorder
    diagnostic_log_period_sec: 1.0  # state/reason changes log immediately; repeats use wall time
    # Required: verified actual Path/map frame, not an assumed map/localization setup.
    planning_frame: map
    base_frame: base_footprint
    odom_frame: odom
    pose_source: tf
    odom_topic: /odom
    allow_odom_fallback: false
    # New low-speed starting values for tuning, not measured real-hardware capabilities.
    control_period: 0.05
    q_lateral: 100.0
    q_heading: 25.0
    r_angular: 4.0
    riccati_tolerance: 1.0e-10
    riccati_max_iterations: 5000
    lookahead_distance: 0.25  # metres; preview never crosses a mandatory corner stop
    nearest_forward_distance: 0.5
    nearest_backward_distance: 0.05
    slowdown_gain: 1.0  # 1/s: v_ref = min(v_nominal, gain * distance to next stop)
    align_gain: 1.5
    heading_tolerance: 0.05
    align_trigger: 0.35  # legacy XY-only mode; continuous recovery uses tracking_align_trigger
    goal_position_tolerance: 0.03
    stopped_linear_tolerance: 0.01
    stopped_angular_tolerance: 0.02
    # Conservative initial error budget; must be checked against inflation/localization uncertainty.
    max_tracking_error: 0.03
    max_path_points: 100000
    # Continuous curve tracking; cruise/physical limits come from motion_limits.yaml.
    feedforward_preview_distance: 0.02  # metres, never crosses a required stop
    tracking_align_trigger: 1.0  # rad; large-error recovery only, not normal arc vertices
    max_reference_curvature: 20.0  # 1/m; reject invalid profile geometry above this value
    reference_heading_tolerance: 0.20  # rad; validate tangents against the associated Path
    gain_schedule_min_speed: 0.05  # below this use the lowest-speed lateral LQR gain
    gain_schedule_samples: 12  # precomputed across min speed .. v_max, interpolated online
    speed_pid:
      kp: 0.4
      ki: 0.2
      kd: 0.0  # derivative term available; start at zero with noisy odometry
      integral_limit: 0.10  # maximum integral contribution, m/s
      correction_limit: 0.05  # maximum PID correction to the reference, m/s
      derivative_filter: 0.10  # seconds, filtered derivative on measured velocity
    tf_timeout_sec: 0.01
    tf_max_age_sec: 0.5
    odom_max_age_sec: 0.25
    max_control_gap_sec: 0.2
    wall_watchdog_timeout_sec: 0.5
