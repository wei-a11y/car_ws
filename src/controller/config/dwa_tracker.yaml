dwa_controller:
  ros__parameters:

    use_sim_time: true

    # ==============================
    # TF
    # ==============================

    # 必须和A*/Phase 4使用的planning_frame一致
    planning_frame: map

    base_frame: base_footprint

    tf_timeout_sec: 0.02

    # ==============================
    # 控制周期
    # ==============================

    # 你的原程序50 ms = 20 Hz
    control_period: 0.05

    # ==============================
    # 到点判定
    # ==============================

    goal_tolerance: 0.15

    # ==============================
    # DWA
    # ==============================

    max_linear: 0.10 # 提高到 0.50 m/s；仍低于安全门 0.60 上限
    min_linear: 0.03

    max_angular: 0.30

    sim_time: 1.0
    sim_dt: 0.05

    # ==============================
    # 评分权重
    # ==============================

    heading_weight: 1.2
    dist_weight: 1.0
    vel_weight: 0.2
    path_weight: 1.2
    obs_weight: 0.0

    collision_penalty: 0.0

    # ==============================
    # 前视点
    # ==============================

    min_lookahead: 0.08
    max_lookahead: 0.20
    lookahead_ratio: 0.25

    # ==============================
    # DWA采样
    # ==============================

    v_samples: 10
    w_samples: 20

    # ==============================
    # 路径搜索范围
    # ==============================

    path_backward_points: 10
    path_forward_points: 50

    # ==============================
    # 障碍检查
    # ==============================

    # 保持你原代码：
    # -1 ~ +1
    # 即3x3
    obstacle_check_radius_cells: 1

    # 保持你原来的：
    # val < 0 || val > 50
    # 视为障碍
    occupied_threshold: 50

    # ==============================
    # 路径上限
    # ==============================

    max_path_points: 100000