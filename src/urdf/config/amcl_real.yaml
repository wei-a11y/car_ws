# Real-map localization. Initialize from RViz /initialpose after map activation.
amcl:
  ros__parameters:
    use_sim_time: false
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint
    map_topic: /map
    scan_topic: /scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    tf_broadcast: true
    transform_tolerance: 0.2
    set_initial_pose: false
    always_reset_initial_pose: true
    min_particles: 500
    max_particles: 2000
    max_beams: 60
    laser_model_type: likelihood_field
    # Use LaserScan's hardware limits rather than the Gazebo sensor limits.
    laser_min_range: -1.0
    laser_max_range: -1.0
    laser_likelihood_max_dist: 2.0
    sigma_hit: 0.2
    z_hit: 0.95
    z_rand: 0.05
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    update_min_d: 0.025
    update_min_a: 0.02
    resample_interval: 1
